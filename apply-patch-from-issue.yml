name: Apply Patch from Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply-patch:
    if: startsWith(github.event.issue.title, '[apply-patch]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract patch from issue body
        uses: actions/github-script@v6
        id: extract
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body || '';
            const m = body.match(/```patch\s*([\s\S]*?)\s*```/m);
            if (!m) {
              core.setFailed('No patch block found in issue body. Use a fenced block: ```patch ... ```');
              return;
            }
            const patch = m[1];
            fs.writeFileSync('patch.diff', patch);
            return { ok: true, length: patch.length };

      - name: Show extracted patch (for logs)
        if: steps.extract.outputs.ok == 'true'
        run: |
          echo "---- patch.diff ----"
          sed -n '1,200p' patch.diff || true
          echo "--------------------"

      - name: Create branch for this patch
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="apply-patch-issue-${ISSUE_NUM}"
          git checkout -b "${BRANCH}"
          echo "Created branch ${BRANCH}"
          echo "${BRANCH}" > .branch-name

      - name: Apply patch (git apply)
        run: |
          set -e
          git apply --index patch.diff
        continue-on-error: false

      - name: Commit applied patch
        run: |
          BRANCH=$(cat .branch-name)
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply patch from issue #${{ github.event.issue.number }}"
          else
            echo "No changes to commit (patch applied no-op)."
          fi

      - name: Push branch using repo PAT
        env:
          REPO_TOKEN: ${{ secrets.APPLY_PATCH_TOKEN }}
        run: |
          BRANCH=$(cat .branch-name)
          git remote set-url origin https://${REPO_TOKEN}@github.com/${{ github.repository }}.git
          git push --set-upstream origin "${BRANCH}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.APPLY_PATCH_TOKEN }}
          commit-message: "chore: apply patch from issue #${{ github.event.issue.number }}"
          branch: apply-patch-issue-${{ github.event.issue.number }}
          title: "Apply patch from issue #${{ github.event.issue.number }} - ${{ github.event.issue.title }}"
          body: |
            This PR contains changes applied from Issue #${{ github.event.issue.number }}.
            Original issue: ${{ github.event.issue.html_url }}
          labels: "auto-applied"
